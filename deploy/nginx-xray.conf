# The live nginx site for xray-terminal.com, copied from the server so it
# is reviewable and rebuildable. Certificate paths are managed by certbot
# (certbot --nginx -d xray-terminal.com -d www.xray-terminal.com).
#
# Two lessons are baked in:
#  - limit_conn belongs on /api/ only. Put it on the server and it counts
#    every asset a browser asks for in parallel, which throttles the page
#    itself rather than the expensive endpoint.
#  - http2 on. Without it a browser opens a separate TLS connection per
#    asset, and a burst of handshakes drops requests.

# One scan costs the public node a burst of calls, and that node bans an
# IP that asks too fast - we have been 403d before. One visitor must not
# be able to spend the whole budget, so scans are paced per address.
limit_req_zone $binary_remote_addr zone=scan:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
  server_name xray-terminal.com www.xray-terminal.com _;


  location /api/ {
    limit_req zone=scan burst=3 nodelay;
    # a scan holds its connection open for its whole run; the page and
    # its assets are never limited, a browser opens those in parallel
    limit_conn conn 4;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600;
  }

    listen 443 ssl; # managed by Certbot
    # one multiplexed connection instead of a fistful of TLS handshakes:
    # without it a browser opens a separate connection per asset
    http2 on;
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xray-terminal.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xray-terminal.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.xray-terminal.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = xray-terminal.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80 default_server;
  listen [::]:80 default_server;
  server_name xray-terminal.com www.xray-terminal.com _;
    return 404; # managed by Certbot




}