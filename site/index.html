<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xray</title>
<meta property="og:title" content="xray">
<meta property="og:description" content="the terminal that shows who is actually in profit in a token">
<meta property="og:image" content="/brand/logo.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/agents.css">
<style>
@font-face { font-family: "Unbounded"; src: url("/brand/fonts/Unbounded[wght].ttf") format("truetype"); font-weight: 200 900; }
@font-face { font-family: "JetBrains Mono"; src: url("/brand/fonts/JetBrainsMono[wght].ttf") format("truetype"); font-weight: 100 800; }
@font-face { font-family: "Tiny5"; src: url("/brand/fonts/Tiny5-Regular.ttf") format("truetype"); }

:root {
  --bg: #05070a; --panel: #0b1118; --edge: #17222e;
  --bone: #cfe4f0; --dim: #5d7387; --glow: #9fd9ff;
  --healthy: #4ef07f; --cracked: #ffd640; --shattered: #ff5c5c;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--bone);
  font-family: "JetBrains Mono", monospace; font-size: 15px;
  padding: 0 16px 64px;
}
.wrap { max-width: 980px; margin: 0 auto; }

header { display: flex; align-items: center; gap: 14px; padding: 26px 0 10px; }
header img { height: 40px; image-rendering: pixelated; }
header .word { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 2px; }
header .tag { color: var(--dim); font-size: 13px; margin-left: auto; text-align: right; }

form { display: flex; gap: 10px; margin: 18px 0 22px; }
input {
  flex: 1; background: var(--panel); color: var(--bone); border: 1px solid var(--edge);
  border-radius: 6px; padding: 14px 16px; font: inherit; outline: none;
}
input:focus { border-color: var(--glow); }
button {
  background: var(--bone); color: var(--bg); border: 0; border-radius: 6px;
  padding: 14px 26px; font-family: "Unbounded", sans-serif; font-weight: 700;
  font-size: 14px; cursor: pointer;
}
button:disabled { opacity: .4; cursor: default; }

/* agent row */
.agents { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.cell {
  background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
  padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center;
  gap: 8px; min-height: 178px; position: relative;
}
.cell .sprite { --px: 1.0; }
@media (min-width: 760px) { .cell .sprite { --px: 2; } .cell { min-height: 240px; } }
.cell .sprite { transform-origin: top center; }
.cell .name { font-family: "Tiny5", monospace; font-size: 15px; letter-spacing: 1px; color: var(--bone); }
.cell .cap { font-size: 11px; color: var(--dim); text-align: center; line-height: 1.35; min-height: 30px; }
.cell.idle { opacity: .35; }
.cell.idle .sprite { animation: none; }
.cell.skip { opacity: .2; }
.cell.skip .sprite { animation: none; }
.cell.work { opacity: 1; box-shadow: 0 0 22px rgba(159, 217, 255, .18); border-color: var(--glow); }
.cell.done { opacity: .7; }
.cell.done .sprite { animation: none; }
.cell.done .cap { color: var(--bone); }
.cell.done::after {
  content: "✓"; position: absolute; top: 6px; right: 9px; color: var(--healthy); font-size: 14px;
}

/* runner strip */
.runstrip { height: 52px; margin: 14px 0 0; position: relative; overflow: hidden; display: none; }
.runstrip.on { display: block; }
.runstrip .ag-run { --px: 1; position: absolute; top: 0; }

/* result */
#error { color: var(--shattered); margin: 18px 0; display: none; white-space: pre-wrap; }
#result { display: none; margin-top: 26px; }
.demo-badge { display: inline-block; font-family: "Tiny5", monospace; color: var(--cracked); border: 1px solid var(--cracked); padding: 2px 8px; margin-bottom: 12px; }
.headline { font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 22px; }
.subline { color: var(--dim); margin: 6px 0 18px; }
.grid { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: start; }
.skel { image-rendering: pixelated; width: 200px; height: 300px; }
.big { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 64px; line-height: 1.1; }
.big.healthy { color: var(--healthy); }
.big.cracked { color: var(--cracked); }
.big.shattered { color: var(--shattered); }
.deadline { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 40px; color: var(--shattered); }
.deadsub { color: var(--bone); font-size: 18px; margin-top: 8px; }
.kv { color: var(--dim); margin: 4px 0; }
.kv b { color: var(--bone); font-weight: 500; }
table { border-collapse: collapse; width: 100%; margin: 14px 0; }
td, th { text-align: left; padding: 5px 14px 5px 0; font-weight: 400; white-space: nowrap; }
th { color: var(--dim); font-size: 12px; }
.pos { color: var(--healthy); } .neg { color: var(--shattered); }
.foot { color: var(--dim); font-size: 12px; margin-top: 18px; }
h3 { font-family: "Unbounded", sans-serif; font-size: 14px; font-weight: 700; margin: 22px 0 6px; }

/* narrow screens: collapse the row to the active agent */
@media (max-width: 600px) {
  .agents { grid-template-columns: 1fr; }
  .cell:not(.work):not(.focus) { display: none; }
  .grid { grid-template-columns: 1fr; }
  .skel { order: -1; margin: 0 auto; }
}
@media (prefers-reduced-motion: reduce) {
  .sprite, .ag-run { animation: none !important; }
  .runstrip { display: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/brand/logo-sprite.png" alt="xray skull">
    <div class="word">XRAY</div>
    <div class="tag">who is actually in profit in a token<br>Robinhood Chain · Pons V2 · read-only</div>
  </header>

  <form id="form">
    <input id="ca" placeholder="token contract address (0x...) or ticker" autocomplete="off" spellcheck="false">
    <button id="go" type="submit">x-ray it</button>
  </form>

  <div class="agents" id="agents"></div>
  <div class="runstrip" id="runstrip"><div class="ag-run travel"></div></div>
  <div id="error"></div>
  <div id="result"></div>
</div>

<script>
const AGENTS = [
  ["scanner", "pulling every trade of this token"],
  ["ledger", "rebuilding each wallet's book: bought, sold, left"],
  ["tracer", "following the same wallets across other tokens"],
  ["auditor", "avg pnl and winrate, wallet by wallet"],
  ["sorter", "splitting holders into groups"],
  ["flagger", "dust, transfers in, first-ever trades"],
];

const agentsEl = document.getElementById("agents");
for (const [name, cap] of AGENTS) {
  const cell = document.createElement("div");
  cell.className = "cell idle";
  cell.id = "cell-" + name;
  cell.innerHTML = `<div class="sprite ag-${name}"></div><div class="name">${name}</div><div class="cap">${cap}</div>`;
  agentsEl.appendChild(cell);
}

const el = (id) => document.getElementById(id);
const fmtUsd = (n) => !isFinite(n) ? "-" : n >= 1e9 ? "$" + (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? "$" + (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? "$" + (n / 1e3).toFixed(0) + "k" : "$" + n.toFixed(0);
const fmtAge = (ms) => { const m = Math.floor(ms / 60000); if (m < 60) return m + "m"; const h = Math.floor(m / 60); if (h < 24) return h + "h " + (m % 60) + "m"; return Math.floor(h / 24) + "d " + (h % 24) + "h"; };
const pct = (n, d = 0) => n === null || n === undefined ? "-" : (n >= 0 ? "+" : "") + n.toFixed(d) + "%";
const cls = (n) => n === null || n === undefined ? "" : n >= 0 ? "pos" : "neg";

let es = null;

function setState(name, state, detail) {
  const cell = el("cell-" + name);
  if (!cell) return;
  cell.className = "cell " + state;
  const cap = cell.querySelector(".cap");
  if (state === "done" && detail) cap.textContent = detail;
  else if (state === "skip") cap.textContent = detail || "skipped";
  else cap.textContent = AGENTS.find((a) => a[0] === name)[1];
  if (state === "work") {
    for (const c of document.querySelectorAll(".cell")) c.classList.remove("focus");
    cell.classList.add("focus");
  }
}

function resetAgents() {
  for (const [name] of AGENTS) setState(name, "idle");
}

function render(p) {
  const r = el("result");
  r.style.display = "block";
  const phase = p.token.phase.kind === "curve" ? `curve ${p.token.phase.fillPct.toFixed(0)}%` : "graduated";
  const a = p.aggregates;
  let mid;
  if (p.dead) {
    mid = `<div class="deadline">TOKEN IS DEAD</div><div class="deadsub">You're too early or too late</div>`;
  } else {
    mid = `<div class="kv">holders avg pnl</div><div class="big ${p.grade}">${pct(a.avgPnlPct)}</div>` +
      (a.avgWinrate !== null ? `<div class="kv">winrate <b>${a.avgWinrate.toFixed(0)}%</b> across ${a.winrateWallets} wallets with 2+ trades</div>` : "") +
      (p.groups.length ? `<h3>groups</h3>` + p.groups.map((g, i) =>
        `<div class="kv">group ${i + 1} <b>${(g.minPct >= 0 ? "+" : "") + g.minPct.toFixed(0)}..${g.maxPct.toFixed(0)}%</b> · ${(g.supplyShare * 100).toFixed(0)}% of supply · ${g.wallets} wallets</div>`).join("") : "");
  }
  const top = p.top.length ? `<h3>top holders</h3><table><tr><th>#</th><th>wallet</th><th>supply</th><th>pnl</th><th>profile</th></tr>` +
    p.top.map((t, i) => {
      const e = t.extras;
      const prof = !e ? "" : e.notRead ? "not read" :
        [e.avgPnlPerTrade !== null ? "avg " + pct(e.avgPnlPerTrade) + "/trade" : "", e.winrate !== null ? e.winrate.toFixed(0) + "% wr" : "", e.trades ? e.trades + " trades" : "", (e.badges || []).map((b) => "[" + b + "]").join("")].filter(Boolean).join(" · ");
      return `<tr><td>${i + 1}</td><td>${t.wallet.slice(0, 6)}..${t.wallet.slice(-4)}</td><td>${(t.supplyShare * 100).toFixed(1)}%</td><td class="${cls(t.pnlPct)}">${pct(t.pnlPct)}</td><td>${prof}</td></tr>`;
    }).join("") + `</table>` : "";
  const ex = p.excluded;
  r.innerHTML =
    (p.demo ? `<div class="demo-badge">DEMO · fixture data, not the live chain</div>` : "") +
    `<div class="headline">$${p.token.symbol}</div>
     <div class="subline">${p.token.address} · ${phase} · age ${fmtAge(p.header.ageMs)}</div>
     <div class="grid"><div>${mid}${top}
       <div class="kv">exited <b>${a.exited.wallets}</b> wallets${a.exited.avgPnlPct !== null ? ", avg pnl " + pct(a.exited.avgPnlPct) : ""}</div>
       ${a.firstTrade ? `<div class="kv">first trade <b>${a.firstTrade.wallets}</b> wallets hold ${(a.firstTrade.supplyShare * 100).toFixed(1)}% of supply</div>` : ""}
       <div class="kv">excluded: dust ${ex.dust}, unknown basis ${ex.unknownBasis.wallets} (${(ex.unknownBasis.supplyShare * 100).toFixed(1)}% supply), infra ${ex.infra}</div>
       <div class="kv">mcap <b>${fmtUsd(p.header.mcapUsd)}</b> · liquidity <b>${fmtUsd(p.header.liquidityUsd)}</b> · volume 24h <b>${fmtUsd(p.header.volume24hUsd)}</b> · holders <b>${p.header.holders}</b></div>
       <div class="foot">source ${p.source.label} · ${p.source.requests} requests · ${p.source.seconds.toFixed(1)}s · grade ${p.grade}</div>
     </div>
     <img class="skel" src="/brand/sprite-h-${p.grade}.png" alt="${p.grade} skeleton"></div>`;
}

el("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const token = el("ca").value.trim();
  if (!token) return;
  if (es) es.close();
  resetAgents();
  el("error").style.display = "none";
  el("result").style.display = "none";
  el("go").disabled = true;
  el("runstrip").classList.add("on");
  es = new EventSource("/api/check?token=" + encodeURIComponent(token));
  es.addEventListener("stage", (e) => {
    const s = JSON.parse(e.data);
    setState(s.agent, s.status === "start" ? "work" : s.status === "done" ? "done" : "skip", s.detail);
  });
  es.addEventListener("result", (e) => render(JSON.parse(e.data)));
  es.addEventListener("error", (e) => {
    if (e.data) {
      el("error").textContent = JSON.parse(e.data).message;
      el("error").style.display = "block";
    }
    finish();
  });
  es.addEventListener("done", finish);
});

function finish() {
  if (es) { es.close(); es = null; }
  el("go").disabled = false;
  el("runstrip").classList.remove("on");
}
</script>
</body>
</html>
